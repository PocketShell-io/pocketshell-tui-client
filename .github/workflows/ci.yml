name: Source-paired maintained client
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  source:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: client
      - uses: actions/checkout@v4
        with:
          repository: PocketShell-io/pocketshell-core
          ref: 01f81f79f9a92878c1df353b164be774a572c3bf
          path: pocketshell-core
      - uses: actions/setup-node@v4
        with:
          node-version: '24.13.1'
      - name: Install locked Core sources without lifecycle hooks
        working-directory: pocketshell-core
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Emit pinned Core ESM contracts without a shell build wrapper
        working-directory: pocketshell-core
        run: node node_modules/typescript/bin/tsc -p tsconfig.json
      - name: Fix emitted Core ESM extensions
        working-directory: pocketshell-core
        run: node scripts/fix-esm-extensions.mjs
      - name: Install locked client dependencies without lifecycle hooks
        working-directory: client
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Source typecheck
        working-directory: client
        run: npm run typecheck
      - name: Linux production controls
        if: runner.os == 'Linux'
        working-directory: client
        run: npm test
      - name: Suite under an inherited proxy env (fail-closed transport)
        if: runner.os == 'Linux'
        working-directory: client
        run: NODE_USE_ENV_PROXY=1 HTTPS_PROXY=http://127.0.0.1:9 HTTP_PROXY=http://127.0.0.1:9 npm test
      - uses: actions/setup-go@v5
        if: runner.os == 'Linux'
        with:
          go-version-file: client/native/psc-relay/go.mod
          cache-dependency-path: client/native/psc-relay/go.sum
      - name: Native listener peer, framing and lifecycle tests
        if: runner.os == 'Linux'
        working-directory: client
        run: |
          go test -C native/psc-relay -race ./...
          npm run bundle:relay
          node scripts/test-relay.mjs
          GOOS=darwin GOARCH=arm64 go build -C native/psc-relay -o /tmp/psc-relay-darwin .
      - name: Upstream integrity and private overlay packaging controls
        working-directory: client
        run: npm run test:packaging
      - name: Emit exact client head using TypeScript directly
        working-directory: client
        run: node node_modules/typescript/bin/tsc -p tsconfig.json
      - name: Read-only release inventory
        working-directory: client
        run: node scripts/record-ci-custody.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: source-paired-${{ runner.os }}-${{ github.sha }}
          path: |
            client/ci-custody.json
            client/dist
          if-no-files-found: error
