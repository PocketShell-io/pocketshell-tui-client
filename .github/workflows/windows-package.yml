name: Windows standalone package
on:
  pull_request:
  push:
    branches: [main, feat/windows-package]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: client
      - uses: actions/checkout@v4
        with:
          repository: PocketShell-io/pocketshell-core
          ref: 8f7b178c3116ffca1996abb99ed86d9561ccb690
          path: pocketshell-core
      - uses: actions/setup-node@v4
        with:
          node-version: '24.13.1'
      - uses: actions/setup-go@v5
        with:
          go-version-file: client/native/psc-security/go.mod
          cache-dependency-path: client/native/psc-security/go.sum
      - working-directory: pocketshell-core
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node node_modules/typescript/bin/tsc -p tsconfig.json
          node scripts/fix-esm-extensions.mjs
      - working-directory: client
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          python3 scripts/build-windows-package.py
      - uses: actions/upload-artifact@v4
        with:
          name: psc-windows-package
          path: client/out/windows/*
          if-no-files-found: error
  windows:
    needs: package
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: client
      - uses: actions/checkout@v4
        with:
          repository: PocketShell-io/pocketshell-core
          ref: 8f7b178c3116ffca1996abb99ed86d9561ccb690
          path: pocketshell-core
      - uses: actions/setup-node@v4
        with:
          node-version: '24.13.1'
      - uses: actions/setup-go@v5
        with:
          go-version-file: client/native/psc-security/go.mod
          cache-dependency-path: client/native/psc-security/go.sum
      - uses: actions/download-artifact@v4
        with:
          name: psc-windows-package
          path: package
      - name: Install Linux-built zip as current user and run installed smoke
        shell: pwsh
        run: |
          $zip = Get-ChildItem package/psc-windows-x64-*.zip | Select-Object -First 1
          $want = (Get-Content "$($zip.FullName).sha256").Split(' ')[0]
          if ((Get-FileHash $zip.FullName).Hash.ToLowerInvariant() -ne $want) { throw 'Zip digest differs' }
          Expand-Archive $zip.FullName "$env:RUNNER_TEMP\psc-package"
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "$env:RUNNER_TEMP\psc-package\install.ps1"
          if ($LASTEXITCODE -ne 0) { throw 'Install failed' }
          & "$env:RUNNER_TEMP\psc-package\install.ps1"
          if ($LASTEXITCODE -ne 0) { throw 'Identical reinstall failed' }
          $version = (Get-Content "$env:RUNNER_TEMP\psc-package\package-manifest.json" -Raw | ConvertFrom-Json).version
          $prefix = "$env:LOCALAPPDATA\PocketShell\psc\$version"
          & "$prefix\psc.cmd" --version
          if ($LASTEXITCODE -ne 0) { throw 'Version failed' }
          & "$prefix\psc.cmd" hosts
          if ($LASTEXITCODE -ne 0) { throw 'Hosts failed' }
          & "$prefix\node.exe" client/scripts/windows/smoke.mjs $prefix
          if ($LASTEXITCODE -ne 0) { throw 'Native smoke failed' }
      - name: Windows boundary unit tests
        shell: pwsh
        run: |
          Set-Location pocketshell-core
          npm ci --ignore-scripts --no-audit --no-fund
          node node_modules/typescript/bin/tsc -p tsconfig.json
          node scripts/fix-esm-extensions.mjs
          Set-Location ../client
          npm ci --ignore-scripts --no-audit --no-fund
          node node_modules/vitest/vitest.mjs run tests/windowsBoundary.test.ts
          if ($LASTEXITCODE -ne 0) { throw 'Boundary tests failed' }
      - name: Named-pipe relay unit tests
        working-directory: client/native/psc-relay
        run: go test ./...
      - name: Named-pipe daemon smoke (opt-in PSC_DAEMON=1)
        shell: pwsh
        run: |
          $version = (Get-Content "$env:RUNNER_TEMP\psc-package\package-manifest.json" -Raw | ConvertFrom-Json).version
          $prefix = "$env:LOCALAPPDATA\PocketShell\psc\$version"
          # Opt-in daemon over the named pipe: spawn, serve, stop.
          $env:PSC_DAEMON = '1'
          & "$prefix\psc.cmd" daemon status --json
          if ($LASTEXITCODE -ne 0) { throw 'daemon status failed' }
          & "$prefix\psc.cmd" hosts --json
          if ($LASTEXITCODE -ne 0) { throw 'daemon-routed hosts failed' }
          & "$prefix\psc.cmd" daemon stop --json
          if ($LASTEXITCODE -ne 0) { throw 'daemon stop failed' }
          # Daemon off: the relay must fall back to the classic entry.
          Remove-Item Env:PSC_DAEMON
          & "$prefix\psc.cmd" hosts --json
          if ($LASTEXITCODE -ne 0) { throw 'classic fallback failed' }
      - name: Native helper unit tests on Windows
        working-directory: client/native/psc-security
        run: go test ./...
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: psc-windows-package
          path: package
      - name: Attach checked Windows package to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" || gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
          gh release upload "$GITHUB_REF_NAME" package/* --repo "$GITHUB_REPOSITORY"
